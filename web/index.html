<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="MediGram — a B2B pharmaceutical export platform. Source WHO-GMP certified medicines, manage verified trade accounts, and track international shipments.">
  <meta name="keywords"
        content="pharmaceutical exports, B2B medicine sourcing, wholesale pharma, global distributor">
  <meta name="author" content="MediGram">

  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MediGram — Global Pharmaceutical Exports">
  <meta property="og:description"
        content="B2B platform for sourcing certified pharmaceuticals and managing export orders worldwide.">
  <meta property="og:site_name" content="MediGram">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MediGram — Global Pharmaceutical Exports">
  <meta name="twitter:description"
        content="B2B platform for sourcing certified pharmaceuticals and managing export orders worldwide.">

  <!-- Browser UI theming -->
  <meta name="theme-color" content="#539692">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediGram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediGram — Global Pharmaceutical Exports</title>
  <link rel="manifest" href="manifest.json">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
  <style>
    /* ------------------------------------------------------------------ */
    /* MediGram loading shell — shown until Flutter renders its first frame */
    /* ------------------------------------------------------------------ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #04262c;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    ::selection {
      background: rgba(99, 188, 152, 0.45);
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #04262c;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0a6c5e, #63bc98);
      border-radius: 8px;
      border: 2px solid #04262c;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #63bc98;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background:
        radial-gradient(1100px 560px at 8% -10%, rgba(99, 188, 152, 0.20), transparent 60%),
        radial-gradient(900px 500px at 108% 112%, rgba(217, 188, 74, 0.12), transparent 60%),
        linear-gradient(160deg, #04262c 0%, #03333b 52%, #05454e 100%);
      z-index: 9999;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .brand-mark {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3.2s ease-in-out infinite;
      box-shadow: 0 18px 44px rgba(2, 22, 27, 0.55);
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 34px;
      border: 1.5px solid rgba(99, 188, 152, 0.45);
      animation: pulse-ring 2.4s ease-out infinite;
    }
    .brand-mark svg {
      width: 46px;
      height: 46px;
      fill: #63bc98;
      filter: drop-shadow(0 3px 6px rgba(2, 22, 27, 0.55));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.92); opacity: 0.8; }
      70%  { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .brand-name {
      margin-top: 26px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #f4f9f7;
      text-shadow: 0 2px 18px rgba(99, 188, 152, 0.35);
    }
    .brand-tagline {
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 3.2px;
      text-transform: uppercase;
      color: rgba(214, 240, 229, 0.82);
    }

    .load-bar {
      margin-top: 34px;
      width: 190px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }
    .load-bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, #63bc98, #d9bc4a);
      animation: slide 1.25s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }

    .load-note {
      margin-top: 18px;
      font-size: 11.5px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(214, 240, 229, 0.72);
    }

    .footer-note {
      position: absolute;
      bottom: 22px;
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(214, 240, 229, 0.55);
    }

    /* Drifting medicine VFX: capsules, tablets, crosses + ECG pulse line */
    .vfx-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .vfx {
      position: absolute;
      display: block;
    }
    .capsule {
      width: 54px;
      height: 24px;
      border-radius: 999px;
      background: linear-gradient(90deg, #63bc98 0 50%, rgba(255, 255, 255, 0.14) 50%);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      opacity: 0.55;
      animation: vfx-drift 9s ease-in-out infinite;
    }
    .capsule.c1 { left: 12%; top: 16%; transform: rotate(-24deg); }
    .capsule.c2 { right: 14%; top: 24%; transform: rotate(18deg); animation-delay: 1.4s; }
    .capsule.c3 { left: 22%; bottom: 18%; transform: rotate(40deg); animation-delay: 2.8s; width: 40px; height: 18px; }
    .tablet {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(99, 188, 152, 0.16);
      border: 1.5px dashed rgba(163, 230, 209, 0.5);
      animation: vfx-drift 11s ease-in-out infinite;
    }
    .tablet.t1 { right: 24%; bottom: 24%; animation-delay: 0.7s; }
    .tablet.t2 { left: 32%; top: 30%; animation-delay: 2.1s; width: 18px; height: 18px; }
    .tablet.t3 { right: 30%; top: 60%; animation-delay: 3.4s; }
    .plus {
      color: rgba(163, 230, 209, 0.5);
      font-size: 26px;
      font-weight: 700;
      animation: vfx-drift 8s ease-in-out infinite;
    }
    .plus.p1 { left: 8%; top: 55%; }
    .plus.p2 { left: 45%; top: 12%; animation-delay: 1.1s; font-size: 20px; }
    .plus.p3 { right: 8%; top: 70%; animation-delay: 2.3s; }
    .plus.p4 { right: 40%; bottom: 12%; animation-delay: 3.1s; font-size: 18px; }
    .ecg {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12%;
      width: 100%;
      height: 80px;
    }
    .ecg path {
      fill: none;
      stroke: rgba(99, 188, 152, 0.6);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
      animation: ecg-run 3.2s linear infinite;
    }
    @keyframes vfx-drift {
      0%, 100% { translate: 0 0; rotate: 0deg; }
      50%      { translate: 8px -16px; rotate: 6deg; }
    }
    @keyframes ecg-run {
      0%   { stroke-dashoffset: 620; opacity: 0.15; }
      12%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { stroke-dashoffset: -620; opacity: 0.15; }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-mark,
      .brand-mark::before,
      .load-bar span,
      .vfx,
      .ecg path {
        animation: none;
      }
      .ecg path {
        stroke-dashoffset: 0;
        opacity: 0.4;
      }
      .med-card {
        transition: none;
      }
    }
  </style>

  <!-- Branded loading screen, removed once Flutter is ready -->
  <div id="loading-screen">
    <div class="vfx-layer" aria-hidden="true">
      <span class="vfx capsule c1"></span>
      <span class="vfx capsule c2"></span>
      <span class="vfx capsule c3"></span>
      <span class="vfx tablet t1"></span>
      <span class="vfx tablet t2"></span>
      <span class="vfx tablet t3"></span>
      <span class="vfx plus p1">+</span>
      <span class="vfx plus p2">+</span>
      <span class="vfx plus p3">+</span>
      <span class="vfx plus p4">+</span>
      <svg class="vfx ecg" viewBox="0 0 600 80" preserveAspectRatio="none">
        <path d="M0 40 H150 L168 40 176 22 190 58 202 30 212 40 H330 L348 40 356 16 372 64 384 26 394 40 H600" />
      </svg>
    </div>
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14H7v-7h3v7zm5 0h-3v-7h3v7zm4 0h-3v-7h3v7z"/>
      </svg>
    </div>
    <div class="brand-name">MediGram</div>
    <div class="brand-tagline">Global Pharmaceutical Exports</div>
    <div class="load-bar"><span></span></div>
    <div class="load-note">Preparing your workspace&hellip;</div>
    <div class="footer-note">WHO-GMP Certified Supply &bull; B2B Trade Platform</div>
  </div>

  <script>
    // Fade the branded loader away as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () { loader.remove(); }, 500);
      }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
