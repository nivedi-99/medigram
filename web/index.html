<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="MediGram — a B2B pharmaceutical export platform. Source WHO-GMP certified medicines, manage verified trade accounts, and track international shipments.">
  <meta name="keywords"
        content="pharmaceutical exports, B2B medicine sourcing, wholesale pharma, global distributor">
  <meta name="author" content="MediGram">

  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MediGram — Global Pharmaceutical Exports">
  <meta property="og:description"
        content="B2B platform for sourcing certified pharmaceuticals and managing export orders worldwide.">
  <meta property="og:site_name" content="MediGram">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MediGram — Global Pharmaceutical Exports">
  <meta name="twitter:description"
        content="B2B platform for sourcing certified pharmaceuticals and managing export orders worldwide.">

  <!-- Browser UI theming -->
  <meta name="theme-color" content="#539692">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediGram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediGram — Global Pharmaceutical Exports</title>
  <link rel="manifest" href="manifest.json">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
  <style>
    /* ------------------------------------------------------------------ */
    /* Base shell — background matches the app theme while Flutter boots  */
    /* ------------------------------------------------------------------ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #04262c;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    ::selection {
      background: rgba(99, 188, 152, 0.45);
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #04262c;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0a6c5e, #63bc98);
      border-radius: 8px;
      border: 2px solid #04262c;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #63bc98;
    }



  </style>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
