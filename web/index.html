<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="MediGram — a B2B pharmaceutical export platform. Source WHO-GMP certified medicines, manage verified trade accounts, and track international shipments.">
  <meta name="keywords"
        content="pharmaceutical exports, B2B medicine sourcing, wholesale pharma, global distributor">
  <meta name="author" content="MediGram">

  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MediGram — Global Pharmaceutical Exports">
  <meta property="og:description"
        content="B2B platform for sourcing certified pharmaceuticals and managing export orders worldwide.">
  <meta property="og:site_name" content="MediGram">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MediGram — Global Pharmaceutical Exports">
  <meta name="twitter:description"
        content="B2B platform for sourcing certified pharmaceuticals and managing export orders worldwide.">

  <!-- Browser UI theming -->
  <meta name="theme-color" content="#EDDC82">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediGram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediGram — Global Pharmaceutical Exports</title>
  <link rel="manifest" href="manifest.json">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
  <style>
    /* ------------------------------------------------------------------ */
    /* MediGram loading shell — shown until Flutter renders its first frame */
    /* ------------------------------------------------------------------ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #faf7e4;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    ::selection {
      background: rgba(237, 220, 130, 0.65);
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f2edd2;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0a6c5e, #63bc98);
      border-radius: 8px;
      border: 2px solid #f2edd2;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #05353f;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background:
        radial-gradient(1100px 520px at 8% -10%, rgba(255, 255, 255, 0.6), transparent 60%),
        radial-gradient(900px 480px at 108% 112%, rgba(99, 188, 152, 0.35), transparent 60%),
        linear-gradient(135deg, #eddc82 0%, #e9d97e 48%, #f4e9a6 100%);
      z-index: 9999;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .brand-mark {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 26px;
      background: #05353f;
      border: 1px solid rgba(5, 53, 63, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3.2s ease-in-out infinite;
      box-shadow: 0 18px 40px rgba(5, 53, 63, 0.3);
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 34px;
      border: 1.5px solid rgba(5, 53, 63, 0.28);
      animation: pulse-ring 2.4s ease-out infinite;
    }
    .brand-mark svg {
      width: 46px;
      height: 46px;
      fill: #eddc82;
      filter: drop-shadow(0 3px 6px rgba(5, 53, 63, 0.3));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.92); opacity: 0.8; }
      70%  { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .brand-name {
      margin-top: 26px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #05353f;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    .brand-tagline {
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 3.2px;
      text-transform: uppercase;
      color: rgba(5, 53, 63, 0.75);
    }

    .load-bar {
      margin-top: 34px;
      width: 190px;
      height: 4px;
      border-radius: 999px;
      background: rgba(5, 53, 63, 0.15);
      overflow: hidden;
    }
    .load-bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: #05353f;
      animation: slide 1.25s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }

    .load-note {
      margin-top: 18px;
      font-size: 11.5px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(5, 53, 63, 0.65);
    }

    .footer-note {
      position: absolute;
      bottom: 22px;
      font-size: 11px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(5, 53, 63, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-mark, .brand-mark::before, .load-bar span { animation: none; }
    }
  </style>

  <!-- Branded loading screen, removed once Flutter is ready -->
  <div id="loading-screen">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14H7v-7h3v7zm5 0h-3v-7h3v7zm4 0h-3v-7h3v7z"/>
      </svg>
    </div>
    <div class="brand-name">MediGram</div>
    <div class="brand-tagline">Global Pharmaceutical Exports</div>
    <div class="load-bar"><span></span></div>
    <div class="load-note">Preparing your workspace&hellip;</div>
    <div class="footer-note">WHO-GMP Certified Supply &bull; B2B Trade Platform</div>
  </div>

  <script>
    // Fade the branded loader away as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () { loader.remove(); }, 500);
      }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
